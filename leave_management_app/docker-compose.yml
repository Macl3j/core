services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leave_management_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/leave_management.db
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-noreply@leavemanagement.com}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Leave Management System}
    volumes:
      # Montuj bazę danych jako volume dla persystencji
      - leave_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Opcjonalnie: PostgreSQL zamiast SQLite dla produkcji
